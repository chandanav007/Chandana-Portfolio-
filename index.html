<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chandana V | Transaction Officer &amp; Payment Operations</title>
  <meta
    name="description"
    content="Portfolio of Chandana V, a Transaction Operations Professional in Bangalore specializing in payment processing, chargeback management, e-disputes, and financial transaction operations."
  />
  <meta name="author" content="Chandana V" />

  <!-- Open Graph / Social Sharing -->
  <meta property="og:title" content="Chandana V | Transaction Officer &amp; Payment Operations" />
  <meta
    property="og:description"
    content="Detail-oriented Transaction Operations Professional with knowledge of payment processing, chargeback management, e-disputes and financial transaction operations."
  />
  <meta property="og:type" content="website" />

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ==========================================================================
       Design System & Variables (Navy Blue, Crisp White & Subtle Gold)
       ========================================================================== */
    :root {
      --navy-950: #071326;
      --navy-900: #0b1f3a;
      --navy-800: #132c4e;
      --navy-700: #1d3c66;
      --gold-500: #c5a059;
      --gold-600: #b08b43;
      --gold-100: #f7f1e3;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-800: #1e293b;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;

      --shadow-sm: 0 2px 8px rgba(11, 31, 58, 0.05);
      --shadow-md: 0 10px 30px rgba(11, 31, 58, 0.08);
      --shadow-lg: 0 20px 45px rgba(11, 31, 58, 0.14);

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      --max-width: 1140px;
    }

    /* ==========================================================================
       Base & Reset
       ========================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 84px;
    }

    body {
      font-family: var(--font-sans);
      color: var(--slate-800);
      background-color: var(--white);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul {
      list-style: none;
    }

    :focus-visible {
      outline: 2px solid var(--gold-500);
      outline-offset: 3px;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin-inline: auto;
      padding-inline: 1.5rem;
    }

    .section {
      padding-block: 5.5rem;
    }

    .section--alt {
      background-color: var(--slate-50);
    }

    .section__header {
      max-width: 680px;
      margin-bottom: 3rem;
    }

    .section__eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold-600);
      margin-bottom: 0.65rem;
    }

    .section__eyebrow::before {
      content: '';
      width: 24px;
      height: 2px;
      background-color: var(--gold-500);
      display: inline-block;
    }

    .section__title {
      font-family: var(--font-serif);
      font-size: clamp(1.85rem, 3vw, 2.4rem);
      color: var(--navy-900);
      line-height: 1.25;
      margin-bottom: 0.75rem;
    }

    .section__subtitle {
      color: var(--slate-600);
      font-size: 1rem;
    }

    /* ==========================================================================
       Buttons
       ========================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.85rem 1.65rem;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.94rem;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: transform var(--transition), background-color var(--transition),
        border-color var(--transition), box-shadow var(--transition), color var(--transition);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn--primary {
      background-color: var(--gold-500);
      color: var(--navy-950);
    }

    .btn--primary:hover {
      background-color: var(--gold-600);
      color: var(--white);
      box-shadow: 0 8px 20px rgba(197, 160, 89, 0.3);
      transform: translateY(-2px);
    }

    .btn--outline-light {
      border-color: rgba(255, 255, 255, 0.35);
      color: var(--white);
      background-color: rgba(255, 255, 255, 0.04);
    }

    .btn--outline-light:hover {
      border-color: var(--gold-500);
      background-color: rgba(197, 160, 89, 0.12);
      transform: translateY(-2px);
    }

    .btn--navy {
      background-color: var(--navy-900);
      color: var(--white);
    }

    .btn--navy:hover {
      background-color: var(--navy-800);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .btn--outline-navy {
      border-color: var(--navy-900);
      color: var(--navy-900);
      background-color: transparent;
    }

    .btn--outline-navy:hover {
      background-color: var(--navy-900);
      color: var(--white);
    }

    /* ==========================================================================
       Sticky Navigation Bar
       ========================================================================== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--slate-200);
      transition: box-shadow var(--transition);
    }

    .navbar.is-scrolled {
      box-shadow: var(--shadow-sm);
    }

    .navbar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: -0.01em;
    }

    .brand__mark {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background-color: var(--navy-900);
      color: var(--gold-500);
      border: 1px solid var(--gold-500);
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-size: 1.05rem;
    }

    .brand__name {
      font-size: 1.08rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.75rem;
    }

    .nav-links a {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--slate-600);
      position: relative;
      padding-block: 0.25rem;
      transition: color var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0;
      height: 2px;
      background-color: var(--gold-500);
      transition: width var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.is-active {
      color: var(--navy-900);
    }

    .nav-links a:hover::after,
    .nav-links a.is-active::after {
      width: 100%;
    }

    .nav-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-sm);
      padding: 0.45rem;
      color: var(--navy-900);
      cursor: pointer;
    }

    /* ==========================================================================
       Hero Section
       ========================================================================== */
    .hero {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 58%, var(--navy-800) 100%);
      color: var(--white);
      padding-block: 5.5rem 6rem;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 82% 20%, rgba(197, 160, 89, 0.14), transparent 45%);
      pointer-events: none;
    }

    .hero__grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 3.5rem;
      align-items: center;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background-color: rgba(197, 160, 89, 0.14);
      border: 1px solid rgba(197, 160, 89, 0.4);
      color: var(--gold-100);
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 1.35rem;
    }

    .hero__title {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4.5vw, 3.35rem);
      line-height: 1.16;
      margin-bottom: 0.85rem;
      color: var(--white);
    }

    .hero__role {
      font-size: clamp(0.95rem, 1.5vw, 1.12rem);
      font-weight: 600;
      color: var(--gold-500);
      letter-spacing: 0.03em;
      margin-bottom: 1.25rem;
    }

    .hero__summary {
      font-size: 1.06rem;
      color: rgba(255, 255, 255, 0.85);
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.25rem;
    }

    .hero__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.75);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 1.4rem;
    }

    .hero__meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .hero__meta-item svg {
      color: var(--gold-500);
      flex-shrink: 0;
    }

    /* Profile Photo Frame */
    .profile-card {
      justify-self: center;
      width: 100%;
      max-width: 340px;
      position: relative;
    }

    .profile-card__frame {
      aspect-ratio: 4 / 5;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
      border: 2px solid rgba(197, 160, 89, 0.55);
      box-shadow: var(--shadow-lg);
      position: relative;
    }

    .profile-card__img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .profile-card__fallback {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at top, rgba(197, 160, 89, 0.18), transparent 65%);
    }

    .profile-card__fallback.is-visible {
      display: flex;
    }

    .profile-card__monogram {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      border: 2px solid var(--gold-500);
      display: grid;
      place-items: center;
      font-family: var(--font-serif);
      font-size: 2.35rem;
      color: var(--gold-500);
      margin-bottom: 1rem;
      background-color: rgba(11, 31, 58, 0.7);
    }

    .profile-card__fallback p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.78);
    }

    .profile-card__caption {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.84rem;
      color: rgba(255, 255, 255, 0.75);
    }

    /* ==========================================================================
       About Section
       ========================================================================== */
    .about__grid {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 3rem;
      align-items: start;
    }

    .about__content p + p {
      margin-top: 1.15rem;
    }

    .about__content p {
      color: var(--slate-600);
      font-size: 1.02rem;
    }

    .about__highlights {
      background-color: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-top: 3px solid var(--gold-500);
      border-radius: var(--radius-md);
      padding: 1.85rem;
      box-shadow: var(--shadow-sm);
    }

    .about__highlights h3 {
      font-size: 1.05rem;
      color: var(--navy-900);
      margin-bottom: 1.25rem;
    }

    .highlight-list {
      display: grid;
      gap: 1rem;
    }

    .highlight-list li {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      font-size: 0.93rem;
      color: var(--slate-600);
    }

    .highlight-list svg {
      color: var(--gold-600);
      flex-shrink: 0;
      margin-top: 3px;
    }

    /* ==========================================================================
       Experience Section
       ========================================================================== */
    .experience-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-left: 4px solid var(--gold-500);
      border-radius: var(--radius-md);
      padding: 2.25rem;
      box-shadow: var(--shadow-sm);
    }

    .experience-card__top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      padding-bottom: 1.4rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--slate-200);
    }

    .experience-card__role {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      color: var(--navy-900);
      margin-bottom: 0.25rem;
    }

    .experience-card__company {
      font-weight: 600;
      color: var(--gold-600);
      font-size: 1.02rem;
    }

    .experience-card__tag {
      background-color: var(--slate-100);
      color: var(--navy-900);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--slate-200);
    }

    .experience-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 0.95rem 2rem;
    }

    .experience-list li {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      color: var(--slate-600);
      font-size: 0.96rem;
    }

    .experience-list li::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--gold-500);
      margin-top: 0.6rem;
      flex-shrink: 0;
    }

    /* ==========================================================================
       Skills Grid
       ========================================================================== */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.15rem;
    }

    .skill-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 1.35rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.95rem;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }

    .skill-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-500);
      box-shadow: var(--shadow-md);
    }

    .skill-card__icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-sm);
      background-color: var(--slate-100);
      color: var(--navy-900);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: background-color var(--transition), color var(--transition);
    }

    .skill-card:hover .skill-card__icon {
      background-color: var(--navy-900);
      color: var(--gold-500);
    }

    .skill-card__title {
      font-weight: 600;
      font-size: 0.96rem;
      color: var(--navy-900);
      line-height: 1.35;
    }

    /* ==========================================================================
       Education Section
       ========================================================================== */
    .education-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 2rem;
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      box-shadow: var(--shadow-sm);
      max-width: 760px;
    }

    .education-card__icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background-color: var(--navy-900);
      color: var(--gold-500);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .education-card__degree {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      color: var(--navy-900);
      margin-bottom: 0.3rem;
    }

    .education-card__college {
      font-weight: 600;
      color: var(--slate-800);
      font-size: 1rem;
    }

    .education-card__university {
      color: var(--slate-500);
      font-size: 0.94rem;
      margin-top: 0.15rem;
    }

    /* ==========================================================================
       Projects Section
       ========================================================================== */
    .projects-notice {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      background-color: var(--gold-100);
      color: var(--navy-900);
      border: 1px solid rgba(197, 160, 89, 0.45);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 500;
      margin-bottom: 2rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background-color: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 1.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold-500);
    }

    .project-card__badge {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-600);
      background-color: var(--gold-100);
      padding: 0.28rem 0.65rem;
      border-radius: 4px;
      margin-bottom: 1rem;
    }

    .project-card__title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--navy-900);
      margin-bottom: 0.75rem;
    }

    .project-card__desc {
      color: var(--slate-600);
      font-size: 0.94rem;
      margin-bottom: 1.5rem;
    }

    .project-card__footer {
      padding-top: 1rem;
      border-top: 1px solid var(--slate-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-card__link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--navy-900);
      transition: color var(--transition);
    }

    .project-card__link:hover {
      color: var(--gold-600);
    }

    /* ==========================================================================
       Resume Section
       ========================================================================== */
    .resume-banner {
      background: linear-gradient(120deg, var(--navy-900), var(--navy-800));
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 3rem 2.75rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(197, 160, 89, 0.35);
    }

    .resume-banner__content {
      max-width: 600px;
    }

    .resume-banner__title {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.6vw, 2.05rem);
      margin-bottom: 0.65rem;
    }

    .resume-banner__text {
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.98rem;
    }

    /* ==========================================================================
       Contact Section
       ========================================================================== */
    .contact-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.25fr;
      gap: 2.5rem;
      align-items: start;
    }

    .contact-info {
      background-color: var(--navy-900);
      color: var(--white);
      border-radius: var(--radius-md);
      padding: 2.25rem;
      box-shadow: var(--shadow-md);
    }

    .contact-info__title {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      margin-bottom: 0.65rem;
    }

    .contact-info__subtitle {
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.94rem;
      margin-bottom: 2rem;
    }

    .contact-info__list {
      display: grid;
      gap: 1.35rem;
    }

    .contact-info__item {
      display: flex;
      align-items: flex-start;
      gap: 0.95rem;
    }

    .contact-info__icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background-color: rgba(197, 160, 89, 0.14);
      color: var(--gold-500);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .contact-info__label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 0.15rem;
    }

    .contact-info__value {
      font-size: 0.96rem;
      font-weight:
